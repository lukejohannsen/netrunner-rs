# The merge gate: the tests on Linux and the security checks, and nothing
# that only builds. `cargo test` and `cargo clippy --workspace --all-targets`
# green on one platform, cargo-deny, gitleaks, and an audit of these
# workflows themselves.
#
# Everything else that used to run here — the workspace on Windows and
# macOS, the Bevy client on all three, the beta toolchain, rustdoc, each
# optional feature and cargo-machete — now runs weekly and on demand in
# platforms.yml. The three-OS matrix was what every merge waited on (the
# desktop job alone was 16m ubuntu / 33m windows cold), and a platform
# break is worth hearing about within a week, not worth holding every merge
# for. The desktop crate is built and tested locally before merging; see
# the Testing Rule in AGENTS.md.
#
# Deliberately absent: `cargo fmt --check`. This codebase has never been
# rustfmt-formatted (`cargo fmt --all --check` reports ~3,860 diff hunks, and
# it is not a max_width mismatch — 2,088 hunks remain at max_width = 200), so
# gating on it would mean a mass-reformat commit that buries every `git blame`
# in the repo. That is a trade worth making deliberately or not at all; it is
# not an oversight here.
#
# Also deliberately absent: `--all-features`. It would enable netrunner_gym's
# `extension-module` (which by design does not link libpython, so the test
# binary cannot run) at the same time as `ort`'s build-time binary download.
# Optional features are exercised one crate at a time in platforms.yml.
#
# Every checkout passes `persist-credentials: false` and every `uses:` is
# pinned to a commit SHA (the tag is in the trailing comment, and Dependabot
# moves both): no job here pushes anything, so nothing needs a credential
# left behind in `.git/config`, and a tag can be moved onto a different
# commit by whoever owns it.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A weekly run catches what a quiet repo otherwise finds out late: a new
  # RustSec advisory, a yanked crate, or a stable-compiler release that
  # breaks the build with no commit of ours involved.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

# Superseded PR runs are pointless; a superseded push to main is still
# history worth having a result for.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Warnings are errors in CI but not locally, so an in-progress `todo!()`
  # with an unused import does not fight you mid-edit.
  RUSTFLAGS: -D warnings
  # The two agent-driven sweeps play complete bot-vs-bot games with tree
  # search on every move, which at opt-level 0 dominates the whole suite.
  # Optimizing the dev profile keeps what release would throw away —
  # debug_assertions and integer-overflow panics, the latter exactly the
  # guard that matters for click/credit/counter arithmetic — and costs about
  # a minute of extra compile.
  CARGO_PROFILE_DEV_OPT_LEVEL: 2
  # Line tables, not full debug info: a CI failure needs a backtrace with
  # file and line, never a debugger's view of locals, and full debug info at
  # opt-level 2 is a fifth of what compiling the workspace costs. Measured on
  # 4 cores (the runner's count) rebuilding the workspace crates over cached
  # dependencies, as every run does: 838s -> 650s; the tests' own runtime is
  # unchanged (344s -> 353s, noise).
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # A push to main whose tree a green PR run already tested gets no second
  # test run. Several agents merge here in a day, and every merge used to
  # repeat the PR's 15 minutes on the identical tree; the cheap jobs below
  # still run, because an advisory published since the PR ran is news.
  #
  # The proof, all from the API (no checkout): a commit C — a parent of the
  # pushed commit (a local `--no-ff` merge) or the head of a PR it came from
  # (a squash or merge on GitHub) — has the same tree as the pushed commit,
  # is not behind the previous main, and has a successful run of this
  # workflow. "Not behind" is what makes C's green run a test of this tree:
  # a PR run tests the merge of C into the main of its day, which was an
  # ancestor of the previous main and so of C, and merging an ancestor
  # changes nothing. A branch merged while behind main has a tree no run
  # has seen, fails the comparison, and is tested in full — that run is
  # where two PRs' interaction shows up (AGENTS.md, Git Hygiene).
  #
  # A push that changes Cargo.lock is tested anyway, because the test job is
  # what saves main's dependency cache and every PR restores from it.
  #
  # Anything unexpected (an API error, no candidate) answers "not tested",
  # so the failure mode is the old behaviour, never a skipped test.
  tested:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -uo pipefail
          skip=false
          tree=$(gh api "repos/$REPO/commits/$SHA" --jq .commit.tree.sha) || tree=
          candidates=$( {
            gh api "repos/$REPO/commits/$SHA" --jq '.parents[].sha' || true
            gh api "repos/$REPO/commits/$SHA/pulls" --jq '.[].head.sha' || true
          } | sort -u)
          # A push that moves the dependency tree still runs: the test job
          # is what saves main's build cache, and every PR starts from it.
          changed=$(gh api "repos/$REPO/compare/$BEFORE...$SHA" --jq '.files[].filename') || tree=
          if grep -qxE 'Cargo\.lock|\.github/actions/setup-rust/action\.yml' <<<"$changed"; then
            echo "The dependency tree or the toolchain setup changed; testing, to refresh the cache."
            tree=
          fi
          for c in $candidates; do
            [ -n "$tree" ] || break
            [ "$c" != "$BEFORE" ] || continue
            ctree=$(gh api "repos/$REPO/commits/$c" --jq .commit.tree.sha) || continue
            [ "$ctree" = "$tree" ] || continue
            behind=$(gh api "repos/$REPO/compare/$BEFORE...$c" --jq .behind_by) || continue
            [ "$behind" = 0 ] || continue
            runs=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$c&status=success" --jq .total_count) || continue
            if [ "${runs:-0}" -gt 0 ]; then
              echo "Tree $tree passed CI on $c; the test job is skipped."
              skip=true
              break
            fi
          done
          [ "$skip" = true ] || echo "No green run has tested tree $tree; testing it."
          echo "skip=$skip" >> "$GITHUB_OUTPUT"

  # The load-bearing jobs, on Linux only. Windows and macOS run the same
  # commands weekly in platforms.yml. The desktop crate is excluded because
  # Bevy is several hundred crates and minutes of cold compile; the small,
  # engine-shaped `netrunner_client` stays in, so the terminal client's
  # lift is still checked on every push.
  #
  # Three jobs on three runners rather than one job doing all three in a
  # row, because one 4-core runner was what every PR waited on. Measured on
  # run 41075114475 (30 October 2026), the single job took 23.5 minutes:
  # clippy 3m, compiling the tests at opt-level 2 10m30s, and running them
  # 10m, of which the two agent sweeps' binaries were 7m (system_gateway_
  # delivery 318s, no_deadlock_sweep 104s) and grow with every deck the
  # pool gains. Split, the sweeps compile only the engine, the bots and the
  # session, and the rest of the suite no longer waits behind them. Each
  # job pays its own compile, which costs runner minutes and saves wall
  # time; the wall time is the thing a merge waits on.
  #
  # `!cancelled()` rather than the default, because `tested` is skipped on
  # every event but a push and a skipped need would skip these jobs too.
  clippy:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - run: cargo clippy --workspace --exclude netrunner_desktop --all-targets --locked -- -D warnings

  # Everything but the four sweep tests, which the job below runs. `--skip`
  # is a substring filter over test names, and these four names are unique
  # in the workspace.
  test:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - run: >-
          cargo test --workspace --exclude netrunner_desktop --locked --
          --skip no_panics_or_deadlocks_across_many_seeds_system_gateway
          --skip every_sample_deck_matchup_finishes
          --skip view_based_agents_never_reach_a_state_with_no_legal_action
          --skip no_client_view_or_log_entry_ever_names_a_card_it_conceals

  # The two agent-driven sweeps (AGENTS.md, Testing Rule), each test binary
  # whole, at the default seed count; the 256-seed runs stay in
  # deep-sweep.yml. The binaries' few fast tests also run in the job above,
  # which costs seconds and keeps the skip list to the slow ones.
  sweeps:
    needs: tested
    if: ${{ !cancelled() && needs.tested.outputs.skip != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: $/.github/actions/setup-rust
      - run: cargo test -p netrunner_single_player --test system_gateway_delivery --locked
      - run: cargo test -p netrunner_session --test no_deadlock_sweep --locked

  # Advisories, licenses, duplicate/banned crates and registry sources. Split
  # into two legs so a newly published CVE does not also hide a license
  # regression, and vice versa. See deny.toml for the policy and why each
  # allowed license is on the list.
  deny:
    name: deny (${{ matrix.checks }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        checks: [advisories, 'bans licenses sources']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check ${{ matrix.checks }}

  # The workflows are themselves code that runs with repository credentials,
  # so they get linted (actionlint: YAML, runner labels, shellcheck over
  # `run:` blocks) and audited (zizmor: script injection, over-broad
  # permissions, unpinned actions).
  #
  # Step order is deliberate: the audit and its upload come first, then
  # actionlint, then the step that fails the job. Both linters therefore run
  # on every push regardless of what the other found, and a finding still
  # reaches the Security tab when the *other* tool is the one that broke —
  # which is not hypothetical, it is how the first version of this job failed.
  workflows:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job needing more than the workflow's `contents: read`, and only
    # for the SARIF upload.
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@9534c84618278caac52cb373bb164ed464dbd8af # v2.87.11
        with:
          tool: zizmor
      # Offline: the online audits want a token with more reach than this job
      # needs. `low` rather than `medium` because five low findings sat in
      # these workflows while this job reported green — a gate should fail on
      # what the tool actually reports, or the next five go unnoticed too.
      #
      # zizmor has no --output flag, so SARIF goes to stdout and into a file.
      # continue-on-error because the upload below must still happen when
      # there are findings: those are the ones worth having in the Security
      # tab. The job's verdict is the last step's, not this one's.
      - name: Audit workflows
        id: zizmor
        continue-on-error: true
        run: zizmor --no-online-audits --min-severity low --format sarif . > zizmor.sarif
      # Guarded on the file existing rather than `always()` alone: if the
      # audit cannot run at all, a missing-file error here would bury the
      # real reason under a second failure. A fork PR's read-only token also
      # cannot upload, which is the other reason this step never decides the
      # job's outcome.
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4
        if: always() && hashFiles('zizmor.sarif') != ''
        with:
          sarif_file: zizmor.sarif
          category: zizmor
      # The two linters disagree about exactly one thing, and this flag is
      # the whole of it: zizmor's self-repository audit wants local actions
      # referenced as `$/...`, while actionlint 1.7.12 does not know that
      # syntax and rejects it as a malformed ref. Scoped to that one form —
      # a genuinely ref-less `actions/checkout` still errors — and DELETE it
      # once actionlint learns `$/`.
      #
      # No spaces and no double quotes in the pattern, deliberately: this
      # action splits `flags` on whitespace honouring double quotes only
      # (`/(?:[^\s"]+|"[^"]*")+/g`), so a quoted pattern containing spaces
      # arrives as four separate arguments and actionlint fails on garbage.
      - uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          flags: -ignore \$/\.github
      # Last, so it cannot skip actionlint above, and `always()` so the audit
      # still reports when actionlint was the failure. Re-runs the audit for
      # readable log output, and exits non-zero as itself.
      - name: Report what the audit found
        if: always() && steps.zizmor.outcome == 'failure'
        run: zizmor --no-online-audits --min-severity low .

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans history, not just the diff, so it needs all of it.
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No license key: gitleaks-action is free for personal accounts and
          # only bills organizations.
          #
          # PR comments are off so this job needs no write scope; a finding
          # fails the check, which is the signal that matters.
          GITLEAKS_ENABLE_COMMENTS: false

  # One stable check name to require in branch protection. The matrix job
  # names above change whenever the matrix does, and `needs` alone would let
  # a skipped or cancelled dependency pass for a success.
  #
  # `clippy`, `test` and `sweeps` may be skipped only when `tested` said
  # so; `tested` itself is skipped on every event but a push, and its
  # failure only means the tests run, so it is not one of the jobs judged
  # here.
  ci:
    if: always()
    needs: [tested, clippy, test, sweeps, deny, workflows, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Fail unless every required job succeeded
        if: >-
          contains(needs.*.result, 'cancelled')
          || needs.clippy.result == 'failure'
          || needs.test.result == 'failure'
          || needs.sweeps.result == 'failure'
          || needs.deny.result != 'success'
          || needs.workflows.result != 'success'
          || needs.secrets.result != 'success'
          || (needs.clippy.result != 'success' && needs.tested.outputs.skip != 'true')
          || (needs.test.result != 'success' && needs.tested.outputs.skip != 'true')
          || (needs.sweeps.result != 'success' && needs.tested.outputs.skip != 'true')
        # Through the environment rather than inlined into the script: a
        # `${{ }}` expansion inside `run:` is textual substitution, and the
        # habit of letting one become shell source is how injection bugs
        # start, even where — as here — the value is trustworthy.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo 'One or more required jobs did not succeed:'
          echo "$NEEDS"
          exit 1
