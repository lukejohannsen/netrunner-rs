[package]
name = "netrunner_client"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

# The toolkit-agnostic client core: what every client of the engine needs
# and no client should own twice — the settings file, the saved-deck store,
# the local record against the bots, the format's card pool. It renders nothing and
# holds no rule; see AGENTS.md's crate map and "Desktop client conventions".
[dependencies]
netrunner_core = { path = "../netrunner_core" }
netrunner_bots = { path = "../netrunner_bots" }
# The one match loop (`Session`), which `play::MatchHandle` runs on its own
# thread, and the masked log entry every client renders.
netrunner_session = { path = "../netrunner_session" }
# The wire messages `connection` and `remote` speak, without the server.
netrunner_protocol = { path = "../netrunner_protocol" }
# `connection`: a seat's token is one.
uuid = "1"
serde = { workspace = true }
serde_json = { workspace = true }
# The OS data directory saved decks, the record and settings live under. The
# same version `netrunner_card_sync` uses for the cache directory, so there
# is one `dirs` in the tree.
dirs = "5"
# Seeds `netrunner_bots::determinize` for `board::breaks`, which plays a
# break route on a sample of the view. The same version the bots use.
rand = "0.9"
# `hosting`: a host asks the router to forward its port (UPnP-IGD,
# NAT-PMP and PCP, renewed while held). Chosen over `igd-next` with
# `crab_nat` because it is one client for all three protocols and does
# the renewal; it is n0's, which a peer-to-peer transport (Phase 4 §6,
# item 3) would bring in anyway. `metrics` off: nothing reads them.
portmapper = { version = "0.19", default-features = false }
# `hosting`: the runtime `portmapper` needs, and its channels.
tokio = { workspace = true }
# `hosting`: a dual-stack listener needs `IPV6_V6ONLY` set, which neither
# `std` nor tokio can say. The version tokio already links.
socket2 = "0.6"
# `remote`: the WebSocket a match is played over. The versions the server
# and the terminal client already use.
tokio-tungstenite = "0.24"
futures-util = "0.3"

[features]
# Forwarded so a client built with a policy network gets the bots' ONNX
# support through this crate rather than naming `netrunner_bots` itself.
onnx = ["netrunner_bots/onnx", "netrunner_session/onnx"]

[dev-dependencies]
# `remote`'s tests drive the driver against a real server on an ephemeral
# port. A dev-dependency only: the client never names the server.
netrunner_server = { path = "../netrunner_server" }
