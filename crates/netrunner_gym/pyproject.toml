[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "netrunner-gym"
version = "0.1.0"
description = "Gymnasium/Stable-Baselines3 environment over netrunner_core's fixed ActionSpace"
requires-python = ">=3.9"
dependencies = [
    "gymnasium>=0.29",
    "numpy>=1.26",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[tool.maturin]
# `lib.rs`'s `#[pymodule] fn netrunner_gym(...)` compiles to
# `netrunner_gym._netrunner_gym`; `python/netrunner_gym/__init__.py` (pure
# Python) imports it from there and layers the actual `gymnasium.Env`
# subclass on top — see that file.
module-name = "netrunner_gym._netrunner_gym"
python-source = "python"
features = ["extension-module"]
