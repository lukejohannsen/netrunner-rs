[package]
name = "netrunner_desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
netrunner_core = { path = "../netrunner_core" }
netrunner_client = { path = "../netrunner_client" }
netrunner_card_sync = { path = "../netrunner_card_sync" }
# Hosting runs a server in this process, as the terminal's Host a game does.
netrunner_server = { path = "../netrunner_server" }
# The dev hook's planner (`dev::Planner`, `NETRUNNER_AUTOPLAY_PLANNER`):
# a match's bots are `netrunner_client::play`'s, and this is the one place
# the client builds an agent of its own, for a screenshot.
netrunner_bots = { path = "../netrunner_bots" }
# A feature subset, not the defaults: `ui` is the flexbox layer every
# screen and the board are built from (it brings the windowing, rendering,
# picking and text it needs), `audio` the sound bank and the music (Ogg Vorbis), `wav` the
# sounds `audio::synth` draws when a set has no recording, `png`/`jpeg`/`webp`
# the card images (NetrunnerDB's 750-pixel scans are WebP only). Nothing
# 3D — no PBR, glTF or lighting — so the build carries only what a 2D
# card game draws. `default_font` rides in with `ui`; the themed
# font under `assets/fonts` sits on top of it. `system_clipboard` is the
# Online screen's: `ui` brings a `Clipboard` resource that only ever
# holds an in-process buffer, and a host's ticket copied out to a friend
# or pasted in from one has to cross the process boundary (arboard,
# which Bevy already chose for its text editing). Decks used to cross it
# the same way; they are files now (`files`).
bevy = { version = "0.19", default-features = false, features = ["ui", "audio", "wav", "png", "jpeg", "webp", "system_clipboard"] }
# The native file dialog a deck is imported from and exported to
# (`files`): the XDG desktop portal on Linux rather than GTK, so nothing
# of GTK is linked, awaited on the tokio runtime the client already has.
rfd = { version = "0.17", default-features = false, features = ["xdg-portal"] }
# Where the save dialog opens: the person's Downloads folder.
dirs = "5"
# A card scan is resampled to the width it is drawn at with `image`: the
# crate Bevy already decodes with, so nothing new is built.
image = { version = "0.25", default-features = false }
# The runtime `netrunner_card_sync` and the remote client run on. Bevy has
# task pools of its own, but the network code is tokio's, and a runtime
# living in a resource on its own thread is the one place the two meet.
tokio = { workspace = true }
# The id of a match to watch, as the server lists it.
uuid = "1"
# A test names a key to stand in for a tournament entrant; the client
# itself reaches a key only through `netrunner_client::identity`.
[dev-dependencies]
netrunner_identity = { path = "../netrunner_identity" }

[features]
# Enables the policy-network opponent, through the client crate.
onnx = ["netrunner_client/onnx"]
# Development only: links Bevy as a shared library so an edit rebuilds in
# seconds rather than minutes. Never for a release build.
dynamic_linking = ["bevy/dynamic_linking"]
