[package]
name = "netrunner_desktop"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
netrunner_core = { path = "../netrunner_core" }
netrunner_client = { path = "../netrunner_client" }
netrunner_card_sync = { path = "../netrunner_card_sync" }
# Hosting runs a server in this process, as the terminal's Host a game does.
netrunner_server = { path = "../netrunner_server" }
# A feature subset, not the defaults: `ui` is the flexbox layer every
# screen and the board are built from (it brings the windowing, rendering,
# picking and text it needs), `audio` the sound bank, `png`/`jpeg`/`webp`
# the card images (NetrunnerDB's 750-pixel scans are WebP only). Nothing
# 3D — no PBR, glTF or lighting — so the build carries only what a 2D
# card game draws. `default_font` rides in with `ui`; the themed
# font under `assets/fonts` sits on top of it. `system_clipboard` is the
# deck builder's: `ui` brings a `Clipboard` resource that only ever
# holds an in-process buffer, and a decklist pasted from NetrunnerDB or
# copied out to a friend has to cross the process boundary (arboard,
# which Bevy already chose for its text editing).
bevy = { version = "0.19", default-features = false, features = ["ui", "audio", "png", "jpeg", "webp", "system_clipboard"] }
# A card scan is resampled to the width it is drawn at with `image`: the
# crate Bevy already decodes with, so nothing new is built.
image = { version = "0.25", default-features = false }
# The runtime `netrunner_card_sync` and the remote client run on. Bevy has
# task pools of its own, but the network code is tokio's, and a runtime
# living in a resource on its own thread is the one place the two meet.
tokio = { workspace = true }
# The id of a match to watch, as the server lists it.
uuid = "1"

[features]
# Enables the policy-network opponent, through the client crate.
onnx = ["netrunner_client/onnx"]
# Development only: links Bevy as a shared library so an edit rebuilds in
# seconds rather than minutes. Never for a release build.
dynamic_linking = ["bevy/dynamic_linking"]
