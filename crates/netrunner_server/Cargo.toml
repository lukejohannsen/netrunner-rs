[package]
name = "netrunner_server"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
netrunner_core = { path = "../netrunner_core" }
netrunner_bots = { path = "../netrunner_bots" }
netrunner_session = { path = "../netrunner_session" }
netrunner_rating = { path = "../netrunner_rating" }
netrunner_protocol = { path = "../netrunner_protocol" }
# The daemon's own key, and the proofs a connection makes of its own.
netrunner_identity = { path = "../netrunner_identity" }
# What a daemon keeps about the keys it has met (Phase 4 §10). Which
# database drivers are compiled in is a feature, so the clients, which
# depend on this crate to host a game in-process with no store, build none:
# `default-features = false` on their side, `sqlite` on by default here for
# the daemon binary.
netrunner_store = { path = "../netrunner_store" }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.9"
clap = { version = "4", features = ["derive"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = "0.3"

[features]
default = ["sqlite"]
sqlite = ["netrunner_store/sqlite"]
postgres = ["netrunner_store/postgres"]

[dev-dependencies]
# The tests read the store the daemon wrote.
netrunner_store = { path = "../netrunner_store", features = ["sqlite"] }
# `start_paused` for the grace-period tests: they wait the full period in zero wall time.
tokio = { workspace = true, features = ["test-util"] }
