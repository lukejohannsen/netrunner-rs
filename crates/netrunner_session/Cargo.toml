[package]
name = "netrunner_session"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
netrunner_core = { path = "../netrunner_core" }
netrunner_bots = { path = "../netrunner_bots" }
serde = { workspace = true }
thiserror = { workspace = true }

[features]
# Forwards to netrunner_bots' onnx feature so a consumer enabling `onnx`
# on this crate gets the same agents downstream, without adding a direct
# `ort` dependency here.
onnx = ["netrunner_bots/onnx"]
