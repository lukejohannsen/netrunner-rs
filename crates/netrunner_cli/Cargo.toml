[package]
name = "netrunner_cli"
version = "0.1.0"
edition = "2024"
license.workspace = true
repository.workspace = true

[dependencies]
netrunner_core = { path = "../netrunner_core" }
netrunner_bots = { path = "../netrunner_bots" }
netrunner_server = { path = "../netrunner_server" }
netrunner_session = { path = "../netrunner_session" }
netrunner_single_player = { path = "../netrunner_single_player" }
netrunner_card_sync = { path = "../netrunner_card_sync" }
netrunner_rating = { path = "../netrunner_rating" }
ratatui = "0.29"
crossterm = "0.28"
clap = { version = "4", features = ["derive"] }
# Resolves the OS-appropriate directory saved decks live in. Same version
# netrunner_card_sync uses for the card cache, so there is one `dirs` in the
# tree rather than two.
dirs = "5"
rand = "0.9"
tokio = { workspace = true }
tokio-tungstenite = "0.24"
futures-util = "0.3"
# Only the type: the session token `ServerMessage::MatchJoined` issues.
uuid = "1"
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# The benchmark suite's worker pool; the same crate self-play and the
# search agents already use, so one pool implementation in the tree.
rayon = "1"

[features]
# Enables `--corp onnx` / `--runner onnx`: playing against a policy network
# trained by `scripts/run_iteration_loop.py`. Off by default because it
# pulls in the ONNX runtime, which not every build of the TUI wants.
onnx = ["netrunner_bots/onnx", "netrunner_single_player/onnx", "netrunner_session/onnx"]
