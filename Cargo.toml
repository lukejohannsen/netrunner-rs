[workspace]
members = [
    "crates/netrunner_core",
    "crates/netrunner_server",
    "crates/netrunner_gym",
    "crates/netrunner_cli",
    "crates/netrunner_bots",
    "crates/netrunner_card_sync",
    "crates/netrunner_selfplay",
    "crates/netrunner_session",
    "crates/netrunner_single_player",
    "crates/netrunner_rating",
    "crates/netrunner_client",
    "crates/netrunner_desktop",
]
resolver = "3"

# Inherited by every crate via `license.workspace = true` /
# `repository.workspace = true`, so these live in exactly one place rather
# than nine copies that can drift apart.
#
# `GPL-3.0-or-later`, not `GPL-3.0-only`: this is the "either version 3 of
# the License, or (at your option) any later version" form the GPL's own
# recommended notice uses — see the "How to Apply These Terms" appendix at
# the end of LICENSE. Change it here if the project ever needs to pin to v3
# exactly.
[workspace.package]
license = "GPL-3.0-or-later"
repository = "https://github.com/lukejohannsen/netrunner-rs"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["full"] }
thiserror = "1.0"

# Dependencies are optimised even in the dev profile; the workspace's own
# crates are not, so `debug_assertions` and the integer-overflow panics
# that guard the engine's arithmetic stay on. This is the Bevy book's
# setting, and the card browser is why it is here: at opt-level 0 the text
# shaping of 271 card faces took over ninety seconds a frame, and the
# client was unusable from `cargo run`. CI's `CARGO_PROFILE_DEV_OPT_LEVEL=2`
# still applies to the workspace crates and is unaffected.
[profile.dev.package."*"]
opt-level = 3
